<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4cc9f0"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 60px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f5f7ff; }
    .pitch { font: 400 25px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #aab3cc; }
    .box   { fill: #131a33; stroke: #2a3558; stroke-width: 2; }
    .acc   { fill: #0c2633; stroke: #4cc9f0; stroke-width: 2.5; }
    .lbl   { font: 600 21px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f5f7ff; }
    .sub   { font: 400 15px 'SFMono-Regular', Menlo, Consolas, monospace; fill: #8f9bbb; }
    .code  { font: 600 15px 'SFMono-Regular', Menlo, Consolas, monospace; fill: #f5f7ff; }
    .tiny  { font: 600 11px 'SFMono-Regular', Menlo, Consolas, monospace; fill: #f5f7ff; }
    .line  { stroke: #4cc9f0; stroke-width: 2.5; fill: none; }
    .edge  { stroke: #4cc9f0; stroke-width: 2; fill: none; opacity: 0.85; }
    .edge2 { stroke: #8f9bbb; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .node  { fill: #131a33; stroke: #4cc9f0; stroke-width: 2; }
    .test  { fill: #131a33; stroke: #f5f7ff; stroke-width: 2; }
    .big   { font: 700 34px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #4cc9f0; }
  </style>

  <rect width="1280" height="640" fill="#0b1020"/>

  <text x="80" y="118" class="title">repo-graph-mcp</text>
  <text x="80" y="164" class="pitch">Your codebase as a deterministic AST knowledge graph, served over MCP.</text>
  <rect x="80" y="188" width="120" height="4" rx="2" fill="#4cc9f0"/>

  <!-- left: the repository -->
  <rect x="80" y="250" width="220" height="300" rx="16" class="box"/>
  <text x="104" y="288" class="lbl">your repo</text>
  <text x="104" y="328" class="code">*.py</text>
  <text x="104" y="352" class="code">*.ts  *.tsx</text>
  <text x="104" y="376" class="code">*.js  *.jsx</text>
  <text x="104" y="420" class="sub">ast (stdlib)</text>
  <text x="104" y="442" class="sub">tree-sitter</text>
  <text x="104" y="478" class="sub">never executed</text>
  <text x="104" y="500" class="sub">.gitignore honoured</text>
  <text x="104" y="522" class="sub">sha256 incremental</text>

  <path d="M300 400 L 356 400" class="line" marker-end="url(#arrow)"/>

  <!-- middle: the graph -->
  <rect x="360" y="250" width="420" height="300" rx="16" class="box"/>
  <text x="384" y="288" class="lbl">graph.db</text>
  <text x="488" y="288" class="sub">SQLite + FTS5 · no embeddings</text>

  <path d="M450 345 L 560 330" class="edge"/>
  <path d="M450 345 L 520 430" class="edge"/>
  <path d="M560 330 L 680 360" class="edge"/>
  <path d="M520 430 L 640 460" class="edge"/>
  <path d="M680 360 L 640 460" class="edge2"/>
  <path d="M560 330 L 520 430" class="edge2"/>
  <path d="M430 500 L 520 430" class="edge"/>
  <path d="M714 468 L 640 460" class="edge"/>

  <circle cx="450" cy="345" r="20" class="node"/><text x="438" y="350" class="tiny">mod</text>
  <circle cx="560" cy="330" r="20" class="node"/><text x="546" y="335" class="tiny">cls</text>
  <circle cx="520" cy="430" r="20" class="node"/><text x="508" y="435" class="tiny">fn</text>
  <circle cx="680" cy="360" r="20" class="node"/><text x="668" y="365" class="tiny">fn</text>
  <circle cx="640" cy="460" r="20" class="node"/><text x="626" y="465" class="tiny">fn</text>
  <circle cx="430" cy="500" r="22" class="test"/><text x="416" y="504" class="tiny">test</text>
  <circle cx="736" cy="470" r="22" class="test"/><text x="722" y="474" class="tiny">test</text>

  <text x="384" y="538" class="sub">imports · calls · inherits · tests</text>

  <path d="M780 400 L 836 400" class="line" marker-end="url(#arrow)"/>

  <!-- right: MCP tools -->
  <rect x="840" y="250" width="360" height="300" rx="16" class="acc"/>
  <text x="864" y="288" class="lbl">MCP tools (stdio)</text>
  <text x="864" y="326" class="code">find_symbol</text><text x="1024" y="326" class="code">source</text>
  <text x="864" y="352" class="code">callers</text><text x="1024" y="352" class="code">callees</text>
  <text x="864" y="378" class="code">impact</text><text x="1024" y="378" class="code">tests_for</text>
  <text x="864" y="404" class="code">path_between</text><text x="1024" y="404" class="code">search</text>
  <text x="864" y="430" class="code">module_summary</text>
  <text x="864" y="476" class="big">20x</text>
  <text x="936" y="466" class="sub">fewer tokens than</text>
  <text x="936" y="488" class="sub">grep + read files</text>
  <text x="864" y="526" class="sub">compact JSON with path:line</text>

  <text x="80" y="600" class="sub">Claude Code · Cursor · Codex · OpenCode · runs 100% locally · github.com/MartinCastroAlvarez/repo-graph-mcp</text>
</svg>
