[tool.poetry]
name = "repo-graph-mcp"
version = "0.1.0"
description = "Turn a codebase into a deterministic AST knowledge graph (no embeddings, no LLM) and serve it over MCP, so coding agents ask the graph instead of grepping."
authors = ["Martín Castro Álvarez <martincastro.10.5@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinCastroAlvarez/repo-graph-mcp"
repository = "https://github.com/MartinCastroAlvarez/repo-graph-mcp"
documentation = "https://github.com/MartinCastroAlvarez/repo-graph-mcp#readme"
keywords = [
    "mcp",
    "model-context-protocol",
    "code-graph",
    "knowledge-graph",
    "ast",
    "static-analysis",
    "claude-code",
    "ai-agents",
    "tree-sitter",
    "sqlite",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
packages = [{ include = "repo_graph_mcp" }]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
repo-graph = "repo_graph_mcp.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
mcp = "^2.3"
pathspec = ">=0.12,<2"
# TypeScript / JavaScript support: `pip install "repo-graph-mcp[typescript]"`.
tree-sitter = { version = ">=0.25,<0.27", optional = true }
tree-sitter-javascript = { version = ">=0.25,<0.26", optional = true }
tree-sitter-typescript = { version = ">=0.23,<0.24", optional = true }

[tool.poetry.extras]
typescript = ["tree-sitter", "tree-sitter-javascript", "tree-sitter-typescript"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = ">=5,<8"
ruff = ">=0.6"
mypy = "^1.11 || ^2.0"
bandit = "^1.7"
pip-audit = "^2.7"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# repo-graph on itself
# --------------------------------------------------------------------------- #
[tool.repo-graph]
exclude = ["tests/fixtures/**"]

# --------------------------------------------------------------------------- #
# Ruff — lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit-style security
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RET",          # returns
    "PIE",          # misc
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "E501"]
"benchmarks/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["repo_graph_mcp", "tests"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=repo_graph_mcp",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["tree_sitter", "tree_sitter.*", "tree_sitter_javascript", "tree_sitter_typescript"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["repo_graph_mcp"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
omit = [
    "repo_graph_mcp/__main__.py",
]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "examples", "benchmarks", ".venv", "build", "dist"]
